services:
  bookfreek:
    build:
      context: .
    container_name: bookfreek
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MEDIA_ROOT: ${AUDIOBOOKS_CONTAINER_PATH:-/audiobooks}
    ports:
      - "${BOOKFREEK_PORT:-17843}:3001"
    volumes:
      - type: bind
        source: ${AUDIOBOOKS_PATH:-./audiobooks}
        target: ${AUDIOBOOKS_CONTAINER_PATH:-/audiobooks}
        read_only: true
